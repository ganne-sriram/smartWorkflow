version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: coreops-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: coreops
      APP_USER_PASSWORD: coreops123
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - coreops-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: coreops-backend
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: coreops
      SPRING_DATASOURCE_PASSWORD: coreops123
      JWT_SECRET: your-secret-key-change-in-production-make-it-at-least-256-bits-long
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - coreops-network
    restart: unless-stopped

  frontend:
    build: .
    container_name: coreops-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - coreops-network
    restart: unless-stopped

volumes:
  oracle_data:

networks:
  coreops-network:
    driver: bridge
