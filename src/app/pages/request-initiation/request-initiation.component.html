<div class="request-container">
  <div class="stepper">
    <div *ngFor="let stage of getStages(); let i = index" class="step" 
         [class.active]="stage === currentStage"
         [class.completed]="stage < currentStage">
      <div class="step-number">{{ stage }}</div>
      <div class="step-label">Stage {{ stage }}</div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="left-sidebar">
      <button class="initiation-btn">Request Initiation</button>
      <div class="sidebar-section" [class.active]="selectedSection === 'case'" (click)="selectedSection = 'case'">
        <span>Case Details</span>
        <span class="arrow">›</span>
      </div>
      <div class="sidebar-section" [class.active]="selectedSection === 'transaction'" (click)="selectedSection = 'transaction'">
        <span>Transaction Details</span>
      </div>
    </div>

    <div class="main-content">
      <div class="details-section">
        <div class="section-header">
          <h3 *ngIf="selectedSection === 'case'">Case Details</h3>
          <h3 *ngIf="selectedSection === 'transaction'">Transaction Details</h3>
        </div>

        <div class="fields-container" *ngIf="selectedSection === 'case'">
          <div *ngFor="let field of caseDetailsFields" class="field-row">
            <label>{{ field.label }}</label>
            <textarea *ngIf="field.type === 'address'" 
                      [(ngModel)]="field.value" 
                      class="field-input field-textarea"
                      rows="4"></textarea>
            <input *ngIf="field.type === 'text'" 
                   type="text" 
                   [(ngModel)]="field.value" 
                   class="field-input">
            <input *ngIf="field.type === 'number'" 
                   type="number" 
                   [(ngModel)]="field.value" 
                   class="field-input">
            <button class="delete-field-btn" (click)="deleteField('case', field.id)" title="Delete field">×</button>
          </div>
        </div>

        <div class="fields-container" *ngIf="selectedSection === 'transaction'">
          <div *ngFor="let field of transactionDetailsFields" class="field-row">
            <label>{{ field.label }}</label>
            <textarea *ngIf="field.type === 'address'" 
                      [(ngModel)]="field.value" 
                      class="field-input field-textarea"
                      rows="4"></textarea>
            <input *ngIf="field.type === 'text'" 
                   type="text" 
                   [(ngModel)]="field.value" 
                   class="field-input">
            <input *ngIf="field.type === 'number'" 
                   type="number" 
                   [(ngModel)]="field.value" 
                   class="field-input">
            <button class="delete-field-btn" (click)="deleteField('transaction', field.id)" title="Delete field">×</button>
          </div>
          <div *ngIf="transactionDetailsFields.length === 0" class="empty-message">
            No fields added yet. Click a button on the right to add fields.
          </div>
        </div>

        <div class="comments-section">
          <label>Request Initiation Comments</label>
          <textarea [(ngModel)]="requestComments" 
                    class="field-input field-textarea"
                    rows="4"
                    placeholder="Enter any additional comments..."></textarea>
        </div>

        <div class="actions">
          <button class="cancel-btn" (click)="cancelRequest()">Cancel Request</button>
          <button class="save-btn" (click)="saveDraft()" [disabled]="!canSave()">Save Draft</button>
        </div>
      </div>
    </div>

    <div class="right-sidebar">
      <button class="field-type-btn text-btn" (click)="openAddFieldDialog(selectedSection)">
        <span class="btn-label">TEXT BUTTON</span>
      </button>
      <button class="field-type-btn address-btn" (click)="openAddFieldDialog(selectedSection); newFieldType = 'address'">
        <span class="btn-label">ADDRESS BUTTON</span>
      </button>
      <button class="field-type-btn number-btn" (click)="openAddFieldDialog(selectedSection); newFieldType = 'number'">
        <span class="btn-label">nUMBER BUTTON</span>
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showAddFieldDialog" (click)="closeAddFieldDialog()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Add New Field</h3>
      <button class="close-btn" (click)="closeAddFieldDialog()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Field Label:</label>
        <input type="text" 
               [(ngModel)]="newFieldLabel" 
               class="modal-input"
               placeholder="Enter field label"
               (keyup.enter)="addField()">
      </div>
      <div class="form-group">
        <label>Field Type:</label>
        <select [(ngModel)]="newFieldType" class="modal-select">
          <option value="text">Text</option>
          <option value="address">Address</option>
          <option value="number">Number</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel-btn" (click)="closeAddFieldDialog()">Cancel</button>
      <button class="modal-add-btn" (click)="addField()" [disabled]="!newFieldLabel.trim()">Add Field</button>
    </div>
  </div>
</div>
