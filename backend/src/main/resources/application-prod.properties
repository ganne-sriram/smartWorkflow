spring.application.name=core-operations-hub
server.port=8080

spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:coreops}

jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-make-it-at-least-256-bits-long}
jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.coreops.hub=INFO
